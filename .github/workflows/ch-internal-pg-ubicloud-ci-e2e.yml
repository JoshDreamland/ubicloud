name: pg-ubicloud-ci E2E

on:
  workflow_dispatch:
    inputs:
      stresshouse_ref:
        description: 'data-plane-application branch for stresshouse tests'
        required: false
        default: 'main'
  schedule:
    - cron: '0 */4 * * *'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  DEVCONTAINER_IMAGE: ubicloud-devcontainer:latest
  STRESSHOUSE_IMAGE: stresshouse-ubicloud:latest

jobs:
  pg-ubicloud-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.WORKFLOW_AUTH_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_AUTH_PRIVATE_KEY }}
          owner: ClickHouse
          repositories: postgres-vm-images,data-plane-configuration,data-plane-application

      - name: Checkout stresshouse tests
        uses: actions/checkout@v4
        with:
          repository: ClickHouse/data-plane-application
          ref: ${{ inputs.stresshouse_ref || 'main' }}
          token: ${{ steps.app-token.outputs.token }}
          path: data-plane-application

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::176778311874:role/GitHubOpenIdConnect
          role-session-name: pg-ubicloud-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Set up Depot CLI
        uses: depot/setup-action@b0b1ea4f69e92ebf5dea3f8713a1b0c37b2126a5 # v1

      - name: Build devcontainer image (Depot cached)
        uses: depot/build-push-action@9785b135c3c76c33db102e45be96a25ab55cd507 # v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: ${{ env.DEVCONTAINER_IMAGE }}
          build-args: WORKSPACE_FOLDER_NAME=ubicloud

      - name: Build stresshouse E2E image (Depot cached)
        uses: depot/build-push-action@9785b135c3c76c33db102e45be96a25ab55cd507 # v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: data-plane-application
          file: data-plane-application/stresshouse/tests/stable/postgres/Dockerfile
          load: true
          tags: ${{ env.STRESSHOUSE_IMAGE }}
          build-args: GOPRIVATE=go.clickhouse.com/*
          secrets: |
            git_token=${{ steps.app-token.outputs.token }}

      - name: Start devcontainer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p ~/.aws/sso
          docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/docker-compose.ci.yml \
            up -d --wait --timeout 720

      - name: Run prepare-pg-ubicloud
        id: prepare
        run: |
          OUTPUT=$(docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/docker-compose.ci.yml \
            exec -T app \
            .devcontainer/scripts/prepare-pg-ubicloud.sh --region us-west-2 2>&1)
          echo "$OUTPUT"

          # Extract PAT token and project ubid from prepare output
          PAT_TOKEN=$(echo "$OUTPUT" | grep "PAT token:" | grep -oP 'pat-\S+')
          PROJECT_UBID=$(echo "$OUTPUT" | grep "Project " | grep -oP 'ubid: \K\S+' | tr -d ')')
          if [ -z "$PAT_TOKEN" ]; then echo "FAIL: could not extract PAT token from prepare output"; exit 1; fi
          if [ -z "$PROJECT_UBID" ]; then echo "FAIL: could not extract project UBID from prepare output"; exit 1; fi
          echo "pat_token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
          echo "project_ubid=$PROJECT_UBID" >> "$GITHUB_OUTPUT"
          echo "Extracted PAT: ${PAT_TOKEN:0:20}..."
          echo "Extracted Project UBID: $PROJECT_UBID"

      - name: Test Ubicloud API
        run: |
          docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/docker-compose.ci.yml \
            exec -T app bash -c '
              TOKEN=$(.devcontainer/scripts/get-pat-token.sh)
              echo "Got PAT token: ${TOKEN:0:20}..."

              echo ""
              echo "=== List projects ==="
              curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:3100/project | jq .

              echo ""
              echo "=== List Postgres resources ==="
              PROJECT_ID=$(curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:3100/project | jq -r ".items[0].id")
              curl -sf -H "Authorization: Bearer $TOKEN" "http://localhost:3100/project/${PROJECT_ID}/location/us-west-2-cell-0/postgres" | jq .
            ' 2>&1

      - name: Create logs directory
        run: mkdir -p /tmp/ci-logs

      - name: Get devcontainer IP
        id: app_ip
        run: echo "ip=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' devcontainer-app-1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        uses: ./.github/actions/run-stresshouse-test
        with:
          name: Smoke test
          entrypoint: /app/pg_ubi_provision_smoke
          plugin_config: '{"api_base_url":"http://api.localhost:3100","api_token":"${{ steps.prepare.outputs.pat_token }}","project_id":"${{ steps.prepare.outputs.project_ubid }}","location":"us-west-2-cell-0","server_size":"m8gd.large","target_size":"m8gd.xlarge","storage_size":118,"target_storage_size":237}'
          image: ${{ env.STRESSHOUSE_IMAGE }}
          network: devcontainer_ubicloud
          api_host: ${{ steps.app_ip.outputs.ip }}
          timeout: "10"

      - name: Run E2E tests in parallel
        env:
          PAT_TOKEN: ${{ steps.prepare.outputs.pat_token }}
          PROJECT_UBID: ${{ steps.prepare.outputs.project_ubid }}
          IMAGE: ${{ env.STRESSHOUSE_IMAGE }}
          NETWORK: devcontainer_ubicloud
          API_HOST: ${{ steps.app_ip.outputs.ip }}
          LOG_DIR: /tmp/ci-logs
        run: |
          set -u
          BASE='"api_base_url":"http://api.localhost:3100","api_token":"'"$PAT_TOKEN"'","project_id":"'"$PROJECT_UBID"'","location":"us-west-2-cell-0"'

          NAMES=()
          PIDS=()

          # Backgrounds the script in the *parent* shell (no subshell), so $!
          # is captured directly and `wait "$pid"` works in the parent.
          launch() {
            local name="$1" entrypoint="$2" config="$3" timeout_min="${4:-25}"
            TEST_NAME="$name" \
            ENTRYPOINT="$entrypoint" \
            PLUGIN_CONFIG="$config" \
            IMAGE="$IMAGE" \
            NETWORK="$NETWORK" \
            API_HOST="$API_HOST" \
            LOG_DIR="$LOG_DIR" \
            TIMEOUT_MIN="$timeout_min" \
              ./.devcontainer/scripts/run-stresshouse-test.sh &
            NAMES+=("$name")
            PIDS+=("$!")
            echo "Launched $name (pid=$!)"
          }

          launch "E2E avail replicas PG17" /app/pg_ubi_avail_replicas \
            "{$BASE,\"server_size\":\"m8gd.large\",\"target_size\":\"m8gd.xlarge\",\"storage_size\":118,\"target_storage_size\":237,\"pg_version\":\"17\"}"

          launch "E2E avail replicas PG18" /app/pg_ubi_avail_replicas \
            "{$BASE,\"server_size\":\"m8gd.large\",\"target_size\":\"m8gd.xlarge\",\"storage_size\":118,\"target_storage_size\":237,\"pg_version\":\"18\"}"

          launch "E2E async HA PG18" /app/pg_ubi_async_ha \
            "{$BASE,\"server_size\":\"m8gd.large\",\"storage_size\":118,\"pg_version\":\"18\"}"

          launch "E2E scaling PITR billing PG18" /app/pg_ubi_scaling_pitr_billing \
            "{$BASE,\"server_size\":\"m8gd.large\",\"target_size\":\"m8gd.xlarge\",\"storage_size\":118,\"target_storage_size\":237,\"pg_version\":\"18\",\"tag_key\":\"sh_test\",\"tag_value\":\"ci-e2e\",\"chc_org_id\":\"00000000-0000-0000-0000-0000ce2ee2e0\"}"

          launch "E2E config security PG18" /app/pg_ubi_config_security \
            "{$BASE,\"server_size\":\"m8gd.large\",\"storage_size\":118,\"pg_version\":\"18\"}"

          EXIT_CODES=()
          for pid in "${PIDS[@]}"; do
            wait "$pid"
            EXIT_CODES+=("$?")
          done

          OVERALL=0
          echo ""
          echo "=== Test results ==="
          for i in "${!NAMES[@]}"; do
            name="${NAMES[$i]}"
            code="${EXIT_CODES[$i]}"
            log_name=$(echo "$name" | tr ' A-Z' '-a-z' | tr -cs 'a-z0-9-' '-')
            if [ "$code" -eq 0 ]; then
              echo "PASS: $name"
            else
              echo "FAIL: $name (exit $code)"
              OVERALL=1
            fi
            echo "::group::$name output"
            for f in "$LOG_DIR/${log_name}.log" "$LOG_DIR/${log_name}-retry"*.log; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
            done
            echo "::endgroup::"
          done
          exit $OVERALL

      - name: Collect debug info
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/docker-compose.ci.yml \
            exec -T app \
            cat /var/log/foreman/foreman.log > /tmp/ci-logs/foreman.log 2>/dev/null || true
          docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/docker-compose.ci.yml \
            logs > /tmp/ci-logs/docker-compose.log 2>&1 || true
          docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/docker-compose.ci.yml \
            exec -T app bash -c '
              RACK_ENV=development bundle exec ruby -r ./loader -e "
                strands = Strand.where(Sequel.like(:prog, \"%Postgres%\")).all
                strands.each do |s|
                  puts \"id=#{s.id} prog=#{s.prog} label=#{s.label} exitval=#{s.exitval}\"
                  puts \"  stack: #{s.stack}\"
                end
              " 2>/dev/null
            ' > /tmp/ci-logs/strand-state.log 2>/dev/null || true

      - name: Triage failure with Claude
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Claude Code stores per-session state under ~/.claude; on the runner
          # that path is not reliably writable (EACCES on session-env, which
          # kills the Bash tool). Point it at a guaranteed-writable dir.
          export CLAUDE_CONFIG_DIR="${RUNNER_TEMP:-/tmp}/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"

          PROMPT=$(cat <<'EOF'
          You are triaging a CI run of the Ubicloud pg-ubicloud-ci E2E pipeline.

          ## Logs (already collected — read them with the Read tool)
          The debug logs are in /tmp/ci-logs/ :
          - foreman.log        — Ubicloud foreman (strand runner). grep for "strand_error"
                                 to find crashing strands; each has "from" (prog.label),
                                 an "exception" (class + message), and a "try" count
                                 (a high count means a crash-loop).
          - strand-state.log   — strand state dump from the DB
          - docker-compose.log — container logs
          - <test>.log         — per-test output (e.g. smoke-test-.log,
                                 e2e-avail-replicas-pg17.log); retries use a -retry2 suffix.

          The stresshouse test source is in ./data-plane-application/stresshouse/tests/stable/postgres/ .
          The Ubicloud checkout is the current working directory; use `git log` for history.

          ## Investigation
          1. Read the per-test logs to find which test failed and its surface error
             (e.g. a server stuck in "creating", exit=124 timeout, an API error).
          2. Read foreman.log and grep "strand_error" for the underlying exception and
             which prog/label raised it, and whether it is crash-looping.
          3. Correlate: an AWS UnauthorizedOperation/AccessDenied => infrastructure/permissions;
             a Ruby exception raised inside a prog => code regression; a timeout with no
             strand error => test/timing.
          4. For a code regression, use `git log --oneline -20` and
             `git log --oneline -- <file>` to name the most likely culprit commit.
          If the run actually passed (no failing test, no blocking strand error), say so
          and use CATEGORY: NONE (still report notable non-fatal strand errors under EVIDENCE).

          ## Output (exactly this format, nothing else)
          CATEGORY: <TEST_PROBLEM | INFRASTRUCTURE_PROBLEM | CODE_REGRESSION | NONE>
          ANALYSIS: <2-3 sentence explanation>
          EVIDENCE: <key log lines / facts that support the conclusion>
          CULPRIT_COMMIT: <SHA and title if CODE_REGRESSION, otherwise N/A>
          NEEDS_MORE: <anything that blocked deeper analysis, or N/A>
          EOF
          )
          npx -y @anthropic-ai/claude-code \
            --print \
            --dangerously-skip-permissions \
            --add-dir /tmp/ci-logs \
            --model sonnet \
            "$PROMPT"

      - name: Cleanup Postgres resources
        if: always()
        run: |
          # Parallel teardown of all Postgres resources + retained timelines, waiting for terminal state.
          docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/docker-compose.ci.yml \
            exec -T app .devcontainer/scripts/cleanup-all-resources.sh 2>&1 || true

      - name: Cleanup stale AWS resources (2+ hours old)
        if: always()
        continue-on-error: true
        run: |
          set +e
          REGION=us-west-2
          CUTOFF=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-2H +%Y-%m-%dT%H:%M:%S)
          echo "Cleaning resources launched before $CUTOFF"

          echo "=== Terminating stale instances ==="
          INSTANCES=$(aws ec2 describe-instances --region $REGION \
            --filters "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              "Name=tag:Ubicloud,Values=true" \
            --query "Reservations[].Instances[?LaunchTime<'${CUTOFF}'].InstanceId" \
            --output text || true)
          if [ -n "$(echo "$INSTANCES" | tr -d ' \t\n')" ]; then
            echo "Terminating: $INSTANCES"
            aws ec2 terminate-instances --instance-ids $INSTANCES --region $REGION || true
            aws ec2 wait instance-terminated --instance-ids $INSTANCES --region $REGION || true
          else
            echo "No stale instances"
          fi

          # Delete orphaned ENIs before releasing EIPs, so an EIP stranded on a detached ENI gets reclaimed.
          echo "=== Deleting orphaned ENIs ==="
          for eni in $(aws ec2 describe-network-interfaces --region $REGION \
            --filters "Name=status,Values=available" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null); do
            echo "Deleting ENI: $eni"
            aws ec2 delete-network-interface --network-interface-id $eni --region $REGION 2>/dev/null || true
          done

          echo "=== Releasing unattached EIPs ==="
          for alloc in $(aws ec2 describe-addresses --region $REGION \
            --query 'Addresses[?AssociationId==null].AllocationId' --output text 2>/dev/null || true); do
            echo "Releasing unattached EIP: $alloc"
            aws ec2 release-address --allocation-id $alloc --region $REGION 2>/dev/null || true
          done

          echo "=== Deleting empty VPCs (no running instances) ==="
          for vpc_id in $(aws ec2 describe-vpcs --region $REGION \
            --filters "Name=isDefault,Values=false" \
            --query 'Vpcs[].VpcId' --output text 2>/dev/null); do
            # Skip VPCs that still have running instances
            if ! ACTIVE=$(aws ec2 describe-instances --region $REGION \
              --filters "Name=vpc-id,Values=$vpc_id" "Name=instance-state-name,Values=pending,running" \
              --query 'Reservations[].Instances[] | length(@)' --output text 2>/dev/null); then
              echo "Skipping VPC $vpc_id (failed to check active instances)"
              continue
            fi
            if ! [[ "$ACTIVE" =~ ^[0-9]+$ ]]; then
              echo "Skipping VPC $vpc_id (unexpected instance count: $ACTIVE)"
              continue
            fi
            if [ "$ACTIVE" != "0" ]; then
              echo "Skipping VPC $vpc_id (has $ACTIVE active instances)"
              continue
            fi
            echo "Deleting empty VPC: $vpc_id"
            for igw in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$vpc_id" \
              --query 'InternetGateways[].InternetGatewayId' --output text --region $REGION 2>/dev/null); do
              aws ec2 detach-internet-gateway --internet-gateway-id $igw --vpc-id $vpc_id --region $REGION 2>/dev/null || true
              aws ec2 delete-internet-gateway --internet-gateway-id $igw --region $REGION 2>/dev/null || true
            done
            for subnet in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc_id" \
              --query 'Subnets[].SubnetId' --output text --region $REGION 2>/dev/null); do
              aws ec2 delete-subnet --subnet-id $subnet --region $REGION 2>/dev/null || true
            done
            for sg in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$vpc_id" \
              --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text --region $REGION 2>/dev/null); do
              aws ec2 delete-security-group --group-id $sg --region $REGION 2>/dev/null || true
            done
            for rt in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$vpc_id" \
              --query 'RouteTables[?Associations[0].Main!=`true`].RouteTableId' --output text --region $REGION 2>/dev/null); do
              aws ec2 delete-route-table --route-table-id $rt --region $REGION 2>/dev/null || true
            done
            aws ec2 delete-vpc --vpc-id $vpc_id --region $REGION 2>/dev/null || true
          done

          # Postgres timeline blob storage. Buckets and IAM policies are named
          # after the timeline ubid (pt + 24 base32 chars) and are intentionally
          # retained after the database is dropped, so the EC2 sweep above never
          # touches them. Force-delete the stale ones here.
          echo "=== Deleting stale Postgres timeline S3 buckets ==="
          for bucket in $(aws s3api list-buckets \
            --query "Buckets[?CreationDate<'${CUTOFF}'].Name" --output text 2>/dev/null || true); do
            [[ "$bucket" =~ ^pt[a-tv-z0-9]{24}$ ]] || continue
            echo "Emptying and deleting bucket: $bucket"
            # Empty (batched DeleteObjects) + delete the bucket. Redirect stdout to
            # drop the per-object "delete:" lines; real errors still surface on stderr.
            # S3 has no delete-non-empty-bucket API, so emptying first is unavoidable.
            # NB: --only-show-errors is invalid for `s3 rb` (transfer-commands only).
            aws s3 rb "s3://$bucket" --force --region $REGION >/dev/null || true
          done

          echo "=== Deleting stale Postgres timeline IAM policies ==="
          for arn in $(aws iam list-policies --scope Local \
            --query "Policies[?CreateDate<'${CUTOFF}'].Arn" --output text 2>/dev/null || true); do
            name="${arn##*/}"
            [[ "$name" =~ ^pt[a-tv-z0-9]{24}$ ]] || continue
            echo "Deleting IAM policy: $arn"
            # Detach from any principals (non-iam-access mode attaches to a user)
            # and remove non-default versions before delete-policy can succeed.
            for u in $(aws iam list-entities-for-policy --policy-arn "$arn" --query 'PolicyUsers[].UserName' --output text 2>/dev/null || true); do
              aws iam detach-user-policy --user-name "$u" --policy-arn "$arn" 2>/dev/null || true
            done
            for r in $(aws iam list-entities-for-policy --policy-arn "$arn" --query 'PolicyRoles[].RoleName' --output text 2>/dev/null || true); do
              aws iam detach-role-policy --role-name "$r" --policy-arn "$arn" 2>/dev/null || true
            done
            for g in $(aws iam list-entities-for-policy --policy-arn "$arn" --query 'PolicyGroups[].GroupName' --output text 2>/dev/null || true); do
              aws iam detach-group-policy --group-name "$g" --policy-arn "$arn" 2>/dev/null || true
            done
            for ver in $(aws iam list-policy-versions --policy-arn "$arn" --query 'Versions[?IsDefaultVersion==`false`].VersionId' --output text 2>/dev/null || true); do
              aws iam delete-policy-version --policy-arn "$arn" --version-id "$ver" 2>/dev/null || true
            done
            aws iam delete-policy --policy-arn "$arn" 2>/dev/null || true
          done

          echo "=== Stale resource cleanup complete ==="

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: /tmp/ci-logs/
          retention-days: 7
